﻿﻿﻿# 太空猎人 - 反向代理配置（HTTPS 模式，HTTP 自动跳转）

server {
    listen 80;
    server_name spacehuntter.com www.spacehuntter.com 39.106.193.166;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name spacehuntter.com www.spacehuntter.com;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/spacehuntter.com.pem;
    ssl_certificate_key /etc/nginx/ssl/spacehuntter.com.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "ok\n";
    }

    # 本地文件存储（图片上传）— ^~ 确保优先于图片正则匹配
    location ^~ /local-files/ {
        alias /home/admin/spacehunter/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
    }

    # API 请求代理到后端 NestJS 服务
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Swagger API 文档
    location /api/docs {
        proxy_pass http://backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端页面代理到 Next.js 服务
    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js 静态资源
    location /_next/static/ {
        proxy_pass http://web:3001;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # 图片等静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        proxy_pass http://web:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 字体文件缓存
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        proxy_pass http://web:3001;
        proxy_set_header Host $host;
        expires 180d;
        add_header Cache-Control "public, immutable";
    }
}
